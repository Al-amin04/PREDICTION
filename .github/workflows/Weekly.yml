name: Weekly predictions

on:
  schedule:
    - cron: "0 7 * * 4"   # every Thursday 07:00 UTC
  workflow_dispatch:       # lets you run it by hand

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run model
        run: python predict.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}

      - name: Save results to repo
        run: |
          git config user.name "prediction-bot"
          git config user.email "bot@users.noreply.github.com"
          git add predictions.md predictions.csv
          git commit -m "Weekly predictions" || echo "No changes"
          git push
